name: Dependency Security Scan

# 2026-11-22：依賴漏洞掃描（NFR-003 SCA）。不部署、不需雲端憑證。
# 前端：npm audit 只擋會進瀏覽器的 runtime 依賴（--omit=dev）High 以上；dev 依賴只列報告。
# 後端：Maven 產生 CycloneDX SBOM（反映實際解析版本），osv-scanner 掃描，有已知漏洞即失敗。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * 1' # 每週一 01:17 UTC，抓新公布的 CVE
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (runtime, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all, report only)
        if: always()
        working-directory: frontend
        run: npm audit || true

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      # NFR-003 CQ-50：用 Maven 實際解析結果（含 tomcat.version 等 property 覆寫）產生 SBOM，再交給 osv-scanner，
      # 避免掃描器自行解析 pom 時忽略覆寫而誤報或漏報。只含 runtime/compile scope。
      - name: Generate CycloneDX SBOM
        working-directory: backend
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DoutputFormat=json -DoutputName=bom.cdx -DincludeTestScope=false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1
      - name: osv-scanner (backend SBOM)
        run: ~/go/bin/osv-scanner scan source -L backend/target/bom.cdx.json
